services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: abm_bot
      POSTGRES_USER: abm_bot
      POSTGRES_PASSWORD: abm_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:


